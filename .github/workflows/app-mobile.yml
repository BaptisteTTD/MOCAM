# Compile l'app MOCAM pour les téléphones, sur les serveurs de GitHub.
# Lancement : onglet "Actions" du dépôt > "App mobile MOCAM" > "Run workflow".
# Résultat : en bas de la page du lancement, rubrique "Artifacts" :
#   - MOCAM-android : MOCAM.apk à installer sur le téléphone Android
#   - MOCAM-iphone  : MOCAM-non-signee.ipa à installer avec Sideloadly (Apple ID gratuit)
name: App mobile MOCAM

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/MocapCamPhone/**"
      - ".github/workflows/app-mobile.yml"

defaults:
  run:
    working-directory: mobile/MocapCamPhone

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/MocapCamPhone/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Compilation APK
        working-directory: mobile/MocapCamPhone/android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk MOCAM.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MOCAM-android
          path: mobile/MocapCamPhone/MOCAM.apk

  iphone:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/MocapCamPhone/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1
      - name: Pods
        working-directory: mobile/MocapCamPhone/ios
        run: pod install
      - name: Compilation (sans signature, Sideloadly signera avec votre Apple ID)
        working-directory: mobile/MocapCamPhone/ios
        run: |
          set -o pipefail
          xcodebuild -workspace MOCAM.xcworkspace -scheme MOCAM \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/MOCAM.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 80
      - name: Création de l'IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/MOCAM.xcarchive/Products/Applications/MOCAM.app Payload/
          zip -qr MOCAM-non-signee.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MOCAM-iphone
          path: mobile/MocapCamPhone/MOCAM-non-signee.ipa
