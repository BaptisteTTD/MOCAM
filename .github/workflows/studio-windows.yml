# Construit MOCAM Studio.exe pour Windows (Python, bibliothèques et Blender compris), sur les serveurs
# de GitHub, puis le vérifie et le publie.
# Résultat : page "Releases" du dépôt, fichier MOCAM-Studio-Windows.zip (et rubrique
# "Artifacts" du lancement).
name: MOCAM Studio Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mocapcam/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/studio-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"      # version exigée par bpy (Blender intégré)
          cache: pip
      - name: Même version pour le serveur et l'interface
        shell: bash
        run: |
          srv=$(grep -oP 'STUDIO_VERSION = "\K[0-9.]+' mocapcam/studio_server.py)
          ui=$(grep -oP "const UI_VERSION = '\K[0-9.]+" mocapcam/studio_ui/index.html)
          echo "serveur $srv, interface $ui"
          [ "$srv" = "$ui" ] || { echo "::error::UI_VERSION ($ui) différente de STUDIO_VERSION ($srv)"; exit 1; }
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller bpy
      - name: MOCAM Studio.exe
        run: pyinstaller packaging/mocam_studio.spec --noconfirm
      - name: Fichiers d'accompagnement
        shell: pwsh
        run: |
          $d = "dist/MOCAM Studio"
          New-Item -ItemType Directory "$d/personnages_fournis" -Force | Out-Null
          Copy-Item personnages_fournis/LISEZMOI.txt "$d/personnages_fournis/"
          Copy-Item personnages_fournis/MOCAM_Bot.glb "$d/personnages_fournis/"
          Copy-Item packaging/LISEZMOI.txt "$d/"
      - name: Vérification (modèles, ffmpeg, Blender intégré, démarrage du Studio)
        shell: pwsh
        run: |
          $d = (Resolve-Path "dist/MOCAM Studio").Path
          $exe = Join-Path $d "MOCAM Studio.exe"
          & $exe diagnostic
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "studio","--sans-fenetre","--port","8899" -WorkingDirectory $d -PassThru
          $v = $null
          for ($i = 0; $i -lt 30 -and -not $v; $i++) {
            Start-Sleep 2
            try { $v = Invoke-RestMethod http://localhost:8899/version } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $v) { Write-Error "le Studio ne répond pas"; exit 1 }
          Write-Output "Studio $($v.version) OK"
          Start-Sleep 2
          foreach ($x in "studio","captures","visages","modeles") { Remove-Item -Recurse -Force (Join-Path $d $x) -ErrorAction SilentlyContinue }
          Remove-Item -Force (Join-Path $d "MOCAM Studio.lnk") -ErrorAction SilentlyContinue
      - name: Archive
        shell: pwsh
        run: |
          $ver = (Select-String -Path mocapcam/studio_server.py -Pattern 'STUDIO_VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          "STUDIO_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          7z a -tzip -mx=7 MOCAM-Studio-Windows.zip "./dist/MOCAM Studio" | Out-Null
          Get-Item MOCAM-Studio-Windows.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: MOCAM-Studio-Windows
          path: MOCAM-Studio-Windows.zip
          compression-level: 0
      - name: Publication (Releases)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="studio-v${STUDIO_VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" MOCAM-Studio-Windows.zip --clobber
          else
            gh release create "$tag" MOCAM-Studio-Windows.zip --title "MOCAM Studio ${STUDIO_VERSION} (Windows)" \
              --notes "Décompressez, puis lancez MOCAM Studio.exe (rien d'autre à installer). Voir LISEZMOI.txt."
          fi
